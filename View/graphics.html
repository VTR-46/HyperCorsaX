    <!-- ===================== PAINEL TEMPOS DE VOLTA ===================== -->
    <section id="lapPanel" class="lap-panel">
        <div class="lap-block lap-block-current">
            <span class="lap-label">VOLTA ATUAL</span>
            <span id="lap-current" class="lap-value">--:--.---</span>
        </div>

        <div class="lap-block lap-block-last">
            <span class="lap-label">ÚLTIMA</span>
            <span id="lap-last" class="lap-value">--:--.---</span>
        </div>

        <div class="lap-block lap-block-best">
            <span class="lap-label">MELHOR</span>
            <span id="lap-best" class="lap-value">--:--.---</span>
        </div>

        <div class="lap-block lap-block-split">
            <span class="lap-label">SPLIT</span>
            <span id="lap-split" class="lap-value">--:--.---</span>
        </div>

        <div class="lap-block lap-block-info">
            <span class="lap-label">VOLTA</span>
            <span id="lap-count" class="lap-value">0 / 0</span>
        </div>

        <div class="lap-block lap-block-info">
            <span class="lap-label">POS</span>
            <span id="lap-pos" class="lap-value">P--</span>
        </div>

        <div class="lap-block lap-block-info">
            <span class="lap-label">SESSÃO</span>
            <span id="lap-session" class="lap-value">--</span>
        </div>

        <div class="lap-block lap-block-info">
            <span class="lap-label">SETOR</span>
            <span id="lap-sector" class="lap-value">0</span>
        </div>
    </section>
