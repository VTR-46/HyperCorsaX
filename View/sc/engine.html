<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperCorsaX - MOTOR</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

    <link rel="stylesheet" href="../Style/wb.css">
    <link rel="stylesheet" href="../src/output.css">

</head>

<body>

    <div class="header">
        <div class="header-brand">
            <img src="../img/bannerIcon.png" alt="HyperCorsaX" class="header-logo">
            <h1 class="header-tab-name">POWERTRAIN</h1>
        </div>
        <div class="header-actions">
            <span id="t-ws-status" class="ws-status ws-off">● DESCONECTADO</span>
            <span id="lapRecordStatus" class="lap-record-status hidden"></span>
            <button id="btnLapRecord" class="btn-record" onclick="openLapModal()" title="Gravar telemetria por número de voltas">GRAVAR VOLTAS</button>
            <button id="btnAutoScroll" class="btn-scroll" onclick="toggleAutoScroll()">Auto-Scroll: LIGADO</button>
        </div>
    </div>

    <!-- ===================== MODAL: NÚMERO DE VOLTAS ===================== -->
    <div id="lapRecordModal" class="modal-overlay hidden" onclick="handleModalOverlayClick(event)">
        <div class="modal-box">
            <h2 class="modal-title">Gravar Telemetria</h2>
            <p class="modal-desc">Quantas voltas deseja gravar?</p>
            <input id="lapCountInput" type="number" min="1" max="99" value="1" class="modal-input" />
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" onclick="closeLapModal()">Cancelar</button>
                <button class="modal-btn modal-btn-confirm" onclick="confirmLapRecord()">Confirmar</button>
            </div>
        </div>
    </div>

    <section id="headerSectionT" class="headerSectionT mt-5 w-full rounded-2xl  bg-slate-900/80 p-4">

        <a href="../graphics.html"
            class="group inline-flex items-center gap-3 border border-white bg-linear-to-br px-4 py-2 text-slate-100 transition duration-300 hover:-translate-y-0.5 hover:border-yellow-300/60 hover:from-cyan-yellow/30 focus:outline-none focus:ring-2 focus:ring-yellow-400/70 focus:ring-offset-2 focus:ring-offset-slate-950">
            <img src="../img/info.png" alt="Abrir tela do motor" class="h-10 w-10 -xlp-1.5 ">
            <span class="text-sm font-semibold uppercase tracking-[0.2em]">INFO</span>
        </a>

        <a href="./engine.html"
            class="group inline-flex items-center gap-3 border border-amber-300 bg-linear-to-br px-4 py-2 text-slate-100 transition duration-300">
            <img src="../img/engine.png" alt="Abrir tela do motor" class="h-10 w-10 -xlp-1.5">
            <span class="text-sm font-semibold uppercase tracking-[0.2em]">POWERTRAIN</span>
        </a>

        <a href="./control.html"
            class="group inline-flex items-center gap-3 border border-white bg-linear-to-br px-4 py-2 text-slate-100 transition duration-300 hover:-translate-y-0.5 hover:border-yellow-300/60 hover:from-cyan-yellow/30 focus:outline-none focus:ring-2 focus:ring-yellow-400/70 focus:ring-offset-2 focus:ring-offset-slate-950">
            <img src="../img/steeringWheel.png" alt="Abrir tela de controle" class="h-10 w-10 -xlp-1.5 ">
            <span class="text-sm font-semibold uppercase tracking-[0.2em]">CONTROLE</span>
        </a>

        <a href="./wheels.html"
            class="group inline-flex items-center gap-3 border border-white bg-linear-to-br px-4 py-2 text-slate-100 transition duration-300 hover:-translate-y-0.5 hover:border-yellow-300/60 hover:from-cyan-yellow/30 focus:outline-none focus:ring-2 focus:ring-yellow-400/70 focus:ring-offset-2 focus:ring-offset-slate-950">
            <img src="../img/wheel.png" alt="Abrir tela de rodas" class="h-10 w-10 -xlp-1.5 ">
            <span class="text-sm font-semibold uppercase tracking-[0.2em]">RODAS</span>
        </a>

        <a href="../compare.html"
            class="group inline-flex items-center gap-3 border border-white bg-linear-to-br px-4 py-2 text-slate-100 transition duration-300 hover:-translate-y-0.5 hover:border-yellow-400 hover:from-yellow-300/30 focus:outline-none focus:ring-2 focus:ring-yellow-400/70 focus:ring-offset-2 focus:ring-offset-slate-950">
            <img src="../img/clock.png" alt="Abrir tela de comparacao" class="h-10 w-10 -xlp-1.5 ">
            <span class="text-sm font-semibold uppercase tracking-[0.2em]">COMPARAR</span>
        </a>

        <a href="./tempos.html"
            class="group inline-flex items-center gap-3 border border-white bg-linear-to-br px-4 py-2 text-slate-100 transition duration-300 hover:-translate-y-0.5 hover:border-yellow-300/60 focus:outline-none focus:ring-2 focus:ring-yellow-400/70 focus:ring-offset-2 focus:ring-offset-slate-950">
            <img src="../img/CompTime.png" alt="Abrir tela de tempos" class="h-10 w-10 -xlp-1.5 ">
            <span class="text-sm font-semibold uppercase tracking-[0.2em]">TEMPOS</span>
        </a>

    </section>

    <br>

    <div class="dashboard">
        <div class="chart-container">
            <h3>RPM</h3>
            <canvas id="rpmChart"></canvas>
        </div>
        <div class="chart-container">
            <h3>Pedais</h3>
            <canvas id="pedalsChart"></canvas>
        </div>
    </div>


    <div class="meter-panel-2">

        <div class="meter-combustivel">
            <h3>COMBUSTIVEL</h3>
            <div class="meter-box-fuel">
                <div id="fuelFill" class="meter-fill" style="background: #0004FF;">
                </div>
            </div>
            <div id="fuelValue" class="meter-value">0 L</div>
        </div>

        <div class="meter-ers">
            <h3>ERS</h3>
            <div class="meter-box-ers">
                <div id="ersFill" class="meter-fill" style="background: #0004FF;">
                </div>
            </div>
            <div id="ersValue" class="meter-value">0 %</div>
        </div>

    </div>

    <script src="../JS/recorder.js"></script>
    <script src="../JS/wbScriptEngine.js"></script>
</body>

</html>
